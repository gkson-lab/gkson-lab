<!doctype html>
<html lang="en" data-theme="prism">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gk-labs · not here</title>
  <meta name="description" content="this page isn't here. head back to gk-labs.">
  <meta name="author" content="gk">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="/gkson-lab/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      var root = document.documentElement, theme = null, split = null;
      try { theme = localStorage.getItem('gk-theme'); split = localStorage.getItem('gk-split'); } catch (e) {}
      if (theme === 'dark') theme = 'prism';
      if (theme === 'light') theme = 'print';
      if (theme !== 'prism' && theme !== 'print' && theme !== 'thermal') {
        theme = 'prism';
      }
      root.setAttribute('data-theme', theme);
      if (split !== null && !isNaN(parseFloat(split))) root.style.setProperty('--disp', String(Math.min(2, Math.max(0, parseFloat(split)))));
    })();
  </script>
  <link rel="stylesheet" href="/gkson-lab/assets/css/site.css">
  <script src="/gkson-lab/assets/js/shaders.js" type="module"></script>
  <style>
    .lost { min-height: 100vh; min-height: 100svh; display: grid; align-content: center; gap: 24px; padding: 96px var(--gutter); max-width: 1280px; margin: 0 auto; }
    .lost-mark { position: relative; width: 100%; max-width: 720px; aspect-ratio: 2 / 1; }
    .lost-mark .ca-xl { margin: 0; }
    .lost-mark > .gl { inset: 0; }
    .lost-mark.gl-on .ca-xl { color: transparent; }
    .lost-mark.gl-on .ca-xl::before,
    .lost-mark.gl-on .ca-xl::after { display: none; }
    .lost p { max-width: 30rem; }
    .lost .muted { color: var(--muted); }
  </style>
</head>
<body>
  <div class="paper" data-shader="paper" aria-hidden="true"><div class="gl"></div></div>
  <main class="lost" id="main">
    <div class="lost-mark" data-shader="lens" data-word="404">
      <h1 class="ca ca-xl" data-text="404">404</h1>
      <div class="gl" aria-hidden="true"></div>
    </div>
    <p class="say">this page split into too many colors and wandered off.</p>
    <p class="muted">the link might be old, or it never existed. either way, the good stuff is back home.</p>
    <p><a class="big-link" href="/gkson-lab/">back to gk-labs</a></p>
  </main>
</body>
</html>
